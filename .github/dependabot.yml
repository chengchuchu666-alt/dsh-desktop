# Keep the pinned action majors and devDependencies from floating silently.
# Major versions are handled by dedicated upgrade iterations, not dependabot:
# the runtime must stay on a single-step Electron track and in sync with the
# bundled Node version (see docs/safe-mode-and-presets-iteration-plan.md §7).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: electron
        update-types:
          - version-update:semver-major
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
